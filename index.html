<!DOCTYPE html>
<html>
<head>
  <title>Welcome to Steam</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen text-white bg-[#101822]">
  <script>
    function getValue(){
      let name = document.getElementById("name").value
      let password = document.getElementById("password").value
      localStorage.setItem(name, JSON.stringify({ password: password }))
      document.getElementById("name").classList.add("border", "border-red-400")
      document.getElementById("password").classList.add("border", "border-red-400")
      
      document.getElementById("container").innerHTML = ""

      let template = document.getElementById("error")
      let clone = template.content.cloneNode(true)
      document.getElementById("container").appendChild(clone)
    }

    function removeError(){
      document.getElementById("container").innerHTML = ""
      document.getElementById("name").classList.remove("border", "border-red-400")
      document.getElementById("password").classList.remove("border", "border-red-400")
    }
  </script>

  <div class="h-full w-full bg-[#171d25]"></div>
  <!--Navbar-->
  <div><img src="navbar.png"></div>

  <main class="relative h-180 overflow-hidden">

    <div class="absolute inset-0 bg-cover bg-center opacity-35 blur-[1px]" style="background-image: url('./loginBG.jpg');"></div>

    <div class="absolute inset-0 blur-5"></div>

    <div class="relative max-w-3xl mx-auto pt-24 px-6">
      <h1 class="text-4xl font-bold mb-10">Sign in</h1>
      <div class="bg-[#181a21] w-203 p-8 grid md:grid-cols-[1fr_260px] gap-10 shadow-2xl">
        <div>
          <label class="text-[#1999ff] text-sm font-bold">SIGN IN WITH ACCOUNT NAME</label>
          <input class="w-full mt-2 mb-4 bg-[#32353c] hover:bg-[#3d414a] h-12 px-4 outline-none rounded-sm" type="text" id="name" onclick="removeError()">
          
          <label class="text-gray-400 text-sm font-bold">PASSWORD</label>
          <input class="w-full mt-2 mb-4 bg-[#32353c] hover:bg-[#3d414a] h-12 px-4 outline-none rounded-sm" type="password" id="password" onclick="removeError()">
          
          <label class="flex items-center gap-2 text-gray-300 text-sm mb-5">
            <input type="checkbox" checked class="w-5 h-5">Remember me
          </label>

        <div class="w-120 h-10"><center>
          <button class="w-80 max-w-full h-12 bg-gradient-to-r from-[#06bfff] to-[#2d73ff] rounded-sm text-lg hover:from-[#65ccf0] hover:to-[#588cf5]" onclick="getValue()">Sign in</button></center></div>
      
          <div class="mt-8">
            <div id="container"></div>
            <template id="error">
              <p class="text-red-400">Please check your password and account name and try again.</p>
            </template>
            <a href="./changepassword.html" class="text-gray-400 underline text-sm">Help, I can't sign in</a>
          </div>
        </div>

        <div>
          <h2 class="text-[#1999ff] text-sm font-bold mb-2">OR SIGN IN WITH QR</h2>
          
          <!--QR-->
          <div class="bg-white w-56 h-56 rounded-2xl flex items-center justify-center text-black text-7xl">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://www.bilibili.com/video/BV1UT42167xb/?spm_id_from=333.337.search-card.all.click&vd_source=a2ef9601c8f4a6f6bc825b9c20b07b25" class="w-45 h-45">
          </div>

          <div class="w-56 h-10">
            <center><p class="text-gray-400 text-sm mt-3 text-center">
              Use the <span class="underline">Steam Mobile App</span><br>
              to sign in via QR Code
            </p></center>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!--the foot page-->
  <div><img src="./footpage.png"></div>

</body>
</html>
